<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आराधना कृषी सेवा केंद्र v2.1</title>
    <style>
        :root {
            --primary-color: #1b4d3e;
            --accent-color: #2e7d32;
            --bg-color: #f4f6f5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 600px;
            margin: 10px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .col {
            flex: 1;
        }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .backup-section {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            display: flex;
            gap: 10px;
        }
        footer {
            text-align: center;
            margin: 15px 0;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <div>🌿 आराधना कृषी सेवा केंद्र <span style="background: gold; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px;">v2.1</span></div>
        <div>मोबाईल: 9604832223</div>
    </header>

    <div class="container">
        <h3>1. शेतकरी व बिल माहिती</h3>
        
        <div class="form-group">
            <label>GST पर्याय:</label>
            <select id="gstSelect" onchange="updateBillNumber()">
                <option value="होय">होय (GST)</option>
                <option value="नाही" selected>नाही (Non-GST)</option>
            </select>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>बिल नंबर *</label>
                <input type="text" id="billNo" readonly style="background: #e9ecef;">
            </div>
            <div class="col form-group">
                <label>शेतकऱ्याचे नाव *</label>
                <input type="text" id="farmerName" placeholder="नाव टाईप करा...">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>WhatsApp / फोन</label>
                <input type="text" id="phone" placeholder="98XXXXXXXX">
            </div>
            <div class="col form-group">
                <label>गाव</label>
                <input type="text" id="village" placeholder="गाव">
            </div>
        </div>

        <hr style="border:0; border-top: 1px solid #eee; margin: 15px 0;">

        <h3>2. डेटा बॅकअप व सुरक्षा (Backup & Restore)</h3>
        <p style="font-size: 12px; color: #555;">तुमचा सर्व डेटा सुरक्षित ठेवण्यासाठी बॅकअप डाऊनलोड करा.</p>
        
        <div class="backup-section">
            <button class="btn" style="background: #0275d8;" onclick="exportData()">📥 डेटा डाऊनलोड (Backup)</button>
            <button class="btn" style="background: #f0ad4e; color: #fff;" onclick="document.getElementById('importFile').click()">📤 डेटा अपलोड (Restore)</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <footer>
        Powered by eDost Billing v2.1 | Developed with ❤️ by Sujit Patil
    </footer>

    <script>
        // स्वयंचलित बिल नंबर जनरेटर आणि GST बदल लॉजिक
        function updateBillNumber() {
            let gstVal = document.getElementById('gstSelect').value;
            let prefix = (gstVal === 'होय') ? 'GST-' : 'INV-';
            
            // localStorage मधून शेवटचा नंबर घेणे किंवा डीफॉल्ट 99 वापरणे
            let lastNum = localStorage.getItem('last_bill_seq') || '99';
            document.getElementById('billNo').value = prefix + lastNum;
        }

        // पेज लोड झाल्यावर नंबर सेट करणे
        window.onload = function() {
            updateBillNumber();
            loadSavedForm();
        };

        // फॉर्ममधील डेटा लोकल स्टोरेजमध्ये सेव्ह ठेवणे
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('input', function() {
                localStorage.setItem(this.id, this.value);
            });
        });

        function loadSavedForm() {
            ['farmerName', 'phone', 'village', 'gstSelect'].forEach(id => {
                let savedVal = localStorage.getItem(id);
                if(savedVal) {
                    document.getElementById(id).value = savedVal;
                }
            });
            updateBillNumber();
        }

        // डेटा एक्सपोर्ट (JSON फाईल डाऊनलोड) करणे
        function exportData() {
            let allData = {};
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                allData[key] = localStorage.getItem(key);
            }
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "Aradhana_Billing_Backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // डेटा इम्पोर्ट (Restore) करणे
        function importData(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let importedData = JSON.parse(e.target.result);
                    for (let key in importedData) {
                        localStorage.setItem(key, importedData[key]);
                    }
                    alert('डेटा यशस्वीरित्या रिस्टोअर (Restore) झाला आहे!');
                    location.reload();
                } catch (err) {
                    alert('चुकीची फाईल! कृपया अचूक बॅकअप फाईल निवडा.');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
